LABEL burnbench
TEXT HELP
Boot the BurnBench live medium on BIOS.
Runs the automated hardware burn-in and benchmark suite.
ENDTEXT
MENU LABEL BurnBench live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
