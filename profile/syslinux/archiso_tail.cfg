LABEL existing
TEXT HELP
Boot an existing operating system.
Press TAB to edit the disk and partition number to boot.
ENDTEXT
MENU LABEL Boot existing OS
COM32 chain.c32
APPEND hd0 0

# https://www.memtest.org/
LABEL memtest
MENU LABEL Run Memtest86+ (RAM test)
LINUX /boot/memtest86+/memtest

# FreeDOS (AMI DMI tools) - BIOS-only, boots via MEMDISK.
# memdisk comes from mkarchiso (/boot/syslinux/memdisk); freedos.img is
# spliced into /boot by build.sh's xorriso repack (see build.sh).
LABEL freedos
TEXT HELP
Boot FreeDOS with the AMI DMI tools (AMIDEDOS).
Works on AMI-firmware Lenovo ThinkCentre/Mini/Station to blank asset tags.
ENDTEXT
MENU LABEL FreeDOS (AMI DMI tools)
LINUX /boot/syslinux/memdisk
APPEND initrd=/boot/freedos.img

LABEL reboot
TEXT HELP
Reboot computer.
The computer's firmware must support APM.
ENDTEXT
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Power off computer.
The computer's firmware must support APM.
ENDTEXT
MENU LABEL Power Off
COM32 poweroff.c32
