# BurnBench Hyprland session

monitor=,preferred,auto,1

input {
    kb_layout = us
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# --- autostart ---
exec-once = swaybg -i /usr/local/share/burnbench/wallpaper.png -m fill
exec-once = mako
exec-once = /usr/local/bin/burnbench-session-prep.sh
# THE burn-in window: opens fullscreen automatically, coworkers just walk away
exec-once = kitty --start-as=fullscreen --title BurnBench bash -c '/usr/local/bin/burn-in.sh; echo; read -n 1 -s -r -p "Finished. Press any key to close..."'

# --- keybinds ---
bindel = , XF86AudioRaiseVolume, exec, amixer sset Master 5%+ unmute
bindel = , XF86AudioLowerVolume, exec, amixer sset Master 5%- unmute
bindl  = , XF86AudioMute,        exec, amixer sset Master toggle
bind   = SUPER, Return, exec, kitty
bind   = SUPER, B, exec, kitty --title BurnBench bash -c '/usr/local/bin/burn-in.sh; echo; read -n 1 -s -r -p "Finished..."'
bind   = SUPER, Q, killactive
bind   = SUPER, F, fullscreen
bind   = SUPER, left, movefocus, l
bind   = SUPER, right, movefocus, r
bind   = SUPER, up, movefocus, u
bind   = SUPER, down, movefocus, d

# --- tiling behaviour: tool windows tile instead of floating/stacking ---
windowrule = tile, class:^(guvcview)$
windowrule = tile, class:^(Pavucontrol)$
windowrule = tile, class:^(kitty)$
