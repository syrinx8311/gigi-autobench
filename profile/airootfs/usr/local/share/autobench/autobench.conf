# AutoBench burn-in defaults.
# This file is sourced by /usr/local/bin/autobench.sh on every run.
# Edit it live (nano) or override values per-run via environment variables.

# systester-cli: number of full pi-computation turns (1 = single pass) and
# the wall-clock safety cap in minutes (slow machines still get cut off).
SYSTESTER_TURNS="${SYSTESTER_TURNS:-1}"
SYSTESTER_MAX_MINUTES="${SYSTESTER_MAX_MINUTES:-30}"
# Digits per turn. "auto" = 1M digits per GB of RAM, ROUNDED UP to the next
# valid systester tier (7100MB -> 8M). Set an explicit value to override.
SYSTESTER_DIGITS="${SYSTESTER_DIGITS:-auto}"
SYSTESTER_PER_THREAD_MB="${SYSTESTER_PER_THREAD_MB:-64}"

# GTK Stress Testing phase: stress-ng mirror of GST's "CPU: All methods",
# run for this many seconds while the GST window is open.
GST_SECONDS="${GST_SECONDS:-60}"

# Set CPU governor to performance before testing (1 = yes).
SET_PERFORMANCE_GOVERNOR="${SET_PERFORMANCE_GOVERNOR:-1}"

# Try to connect to the pre-configured WiFi network (1 = yes).
WIFI_CONNECT="${WIFI_CONNECT:-1}"
WIFI_TIMEOUT_SECS="${WIFI_TIMEOUT_SECS:-90}"

# Launch a camera viewer if a camera is detected (1 = yes).
CAMERA_CHECK="${CAMERA_CHECK:-1}"

# Play the success tone at the end (1 = yes).
PLAY_TONE="${PLAY_TONE:-1}"

# Short beep at the very start so a silent laptop is noticed immediately.
START_BEEP="${START_BEEP:-1}"

# Asset tag tool: show/hide the asset tag management tool (1 = yes).
ASSET_TAG_TOOL="${ASSET_TAG_TOOL:-1}"

# On AMI-firmware Lenovo systems, offer a reboot into the DOS/UEFI tool (1 = yes).
FREEDOS_BOOT_ENTRY="${FREEDOS_BOOT_ENTRY:-1}"
