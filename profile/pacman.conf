#
# Pacman configuration used by mkarchiso when installing the airootfs.
# __BURN_REPO__ is replaced by build.sh with the absolute path of the
# local repository holding the AUR-built packages (gst, systester).
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[burnbench]
SigLevel = Optional TrustAll
Server = file://__BURN_REPO__

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
